name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # perlu write agar APK bisa dilampirkan ke GitHub Release saat push tag

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan keystore rilis tetap
        env:
          KILAT_KEYSTORE_B64: ${{ secrets.KILAT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KILAT_KEYSTORE_B64" ]; then
            echo "::error::Secret KILAT_KEYSTORE_B64 kosong. Build dibatalkan agar tidak memakai kunci debug."
            exit 1
          fi
          echo "$KILAT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fluxa-release.jks"
          echo "KILAT_KEYSTORE_PATH=$RUNNER_TEMP/fluxa-release.jks" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Grant execute permission untuk gradlew
        run: chmod +x gradlew

      - name: Unit test
        env:
          KILAT_STORE_PASSWORD: ${{ secrets.KILAT_STORE_PASSWORD }}
          KILAT_KEY_PASSWORD: ${{ secrets.KILAT_KEY_PASSWORD }}
          KILAT_KEY_ALIAS: ${{ secrets.KILAT_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload hasil unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilat-motion-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Lint (non-blocking sementara)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilat-motion-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Build APK (debug + release)
        env:
          KILAT_STORE_PASSWORD: ${{ secrets.KILAT_STORE_PASSWORD }}
          KILAT_KEY_PASSWORD: ${{ secrets.KILAT_KEY_PASSWORD }}
          KILAT_KEY_ALIAS: ${{ secrets.KILAT_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verifikasi signer APK (harus kunci release FLUXA)
        env:
          KILAT_EXPECTED_SHA1: 10b3bfec6ce707b1e46a2f0aebfc2b1b2326dd85
        run: |
          set -e
          shopt -s nullglob
          files=(app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::Tidak ada APK untuk diverifikasi"; exit 1; fi
          for f in "${files[@]}"; do
            echo "Verifikasi $f"
            python3 tools/verify_apk_signer.py "$f" "$KILAT_EXPECTED_SHA1"
          done

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: kilat-motion-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: kilat-motion-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload APK ke GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: Ringkasan build
        run: |
          echo "### FLUXA Motion APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download APK di tab **Artifacts** pada halaman run ini." >> $GITHUB_STEP_SUMMARY
