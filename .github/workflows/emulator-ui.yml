name: UI emulator test

on:
  push:
    branches: [ 'feat/polish-**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Tes UI di emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KILAT_STORE_PASSWORD: ${{ secrets.KILAT_STORE_PASSWORD }}
      KILAT_KEY_PASSWORD: ${{ secrets.KILAT_KEY_PASSWORD }}
      KILAT_KEY_ALIAS: ${{ secrets.KILAT_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan keystore rilis tetap
        env:
          KILAT_KEYSTORE_B64: ${{ secrets.KILAT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KILAT_KEYSTORE_B64" ]; then
            echo "::error::Secret KILAT_KEYSTORE_B64 kosong."
            exit 1
          fi
          echo "$KILAT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fluxa-release.jks"
          echo "KILAT_KEYSTORE_PATH=$RUNNER_TEMP/fluxa-release.jks" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Jalankan emulator dan tes UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/ui_smoke.py

      - name: Upload screenshot dan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots/
          if-no-files-found: warn
